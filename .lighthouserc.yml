ci:
  collect:
    url:
      - https://vishnujan.dev/
    numberOfRuns: 1
  assert:
    # Scores are reported as warnings, never a failed run: the audit is for keeping an eye on
    # performance and accessibility, not a gate (it runs after the site is already deployed).
    assertions:
      categories:performance:
        - warn
        - minScore: 0.8
      categories:accessibility:
        - warn
        - minScore: 0.9
      categories:best-practices:
        - warn
        - minScore: 0.9
      categories:seo:
        - warn
        - minScore: 0.9
  upload:
    target: temporary-public-storage
