<!--
  CANONICAL SUBSCRIBE BLOCK — the single source for every page that ends on it
  (the homepage and every blog post).

  Edit ONLY this file, then run:  node scripts/gen-partials.mjs

  The field itself lives in the subscribe modal (partials/header.html); this block
  is the invitation that opens it. Its background is images/blog/subscribe-bg.jpg,
  a rectangle cut from the footer's own sky-blue gradient + contour sheet, so the
  page's last two blocks read as the same world.
-->
<section class="sub-cta">
  <div class="sub-cta__inner">
    <h2 class="sub-cta__title">Get the next one</h2>
    <p class="sub-cta__text">New posts on data pipelines, web scraping, and market-data experiments — delivered to your inbox as they go up.</p>
    <div class="sub-cta__actions">
      <button type="button" class="pill-btn pill-btn--dark" data-subscribe-open><span class="pill-btn-span">Subscribe</span></button>
      <a class="sub-cta__link" href="/blog/">All writing &rarr;</a>
    </div>
  </div>
</section>
