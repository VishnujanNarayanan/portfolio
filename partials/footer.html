<!--
  CANONICAL FOOTER — the single source for every page.

  Edit ONLY this file, then run:  node scripts/gen-footer.mjs
  That injects the rendered result between the BEGIN/END generated markers in
  index.html and all nine sub-pages. Editing a page's footer directly will be
  overwritten on the next run.

  Tokens:
    {{CONTACT_ID}}  ' id="contact"' on the homepage, empty elsewhere (the id must
                    stay unique, and the homepage nav's Contact link targets it).
    {{TO}}<id>      a homepage SECTION link: '#<id>' on the homepage, '/?go=<id>'
                    elsewhere. NOT '/#<id>' — a fragment does not survive a
                    cross-document navigation here, so those links silently landed
                    on the hero instead of the section. See {{TO}} in
                    scripts/gen-partials.mjs; main.js reads ?go= on arrival.
    {{HOME_HREF}}   '#top' on the homepage (top of document), '/' elsewhere.
    {{HOME}}        '' on the homepage, '/' elsewhere (non-section links).
-->
<footer class="lfooter"{{CONTACT_ID}}>

  <div class="lfooter__layout">
    <!-- Dark notched box (Lando footer mask) with static contour pattern inside -->
    <div class="lfooter__clip">
      <img class="lfooter__pattern" src="/images/footer-blobs.svg" alt="" aria-hidden="true" loading="lazy" decoding="async">

      <div class="lfooter__inner">
        <h2 class="lfooter__headline">
{{FOOTER_HEADLINE}}
        </h2>

        <div class="lfooter__cols">
          <nav class="lfooter__col lfooter__col--left" aria-label="Pages">
            <span class="lfooter__col-label">Pages</span>
            <a href="{{HOME_HREF}}" class="lfooter__navlink">Home</a>
            <a href="{{TO}}projects" class="lfooter__navlink">Projects</a>
            <a href="{{TO}}socials" class="lfooter__navlink">Socials</a>
            <a href="/blog/" class="lfooter__navlink">Blog</a>
          </nav>
          <nav class="lfooter__col lfooter__col--right" aria-label="Social links">
            <span class="lfooter__col-label">Follow On</span>
            <a href="https://github.com/VishnujanNarayanan" target="_blank" rel="me noopener" class="lfooter__navlink">GitHub</a>
            <a href="https://www.linkedin.com/in/vishnujan-narayanan" target="_blank" rel="me noopener" class="lfooter__navlink">LinkedIn</a>
            <a href="https://www.instagram.com/___vi5hnu___/" target="_blank" rel="me noopener" class="lfooter__navlink">Instagram</a>
            <a href="https://substack.com/@vishnujannarayanan" target="_blank" rel="me noopener" class="lfooter__navlink">Substack</a>
          </nav>
        </div>
      </div>

      <!-- Sky-blue tools marquee (logos tinted via CSS mask). Two identical tracks,
           each animated translateX(-100%) of ITS OWN width — so a seamless loop
           needs every track to be at least as wide as the footer, or the strip
           empties out after the last logo and snaps when it wraps. The generator
           repeats the logo list enough times to clear any viewport. -->
      <div class="lfooter__mq" aria-hidden="true">
{{MARQUEE_TRACKS}}
      </div>

      <!-- Blog pages: the subscribe card. Everywhere else: the portrait cutout
           rising from the bottom (where the reference's helmet sits). -->
{{FOOTER_FEATURE}}
    </div>

    <!-- Pill in the bottom-centre tab of the notched box -->
    <!-- No trailing arrow: main.js splits this into per-letter reel clips on load, and a
         glyph that is not a letter reels along with them. -->
    <a class="lfooter__email" href="mailto:narayanan.vishnujan@gmail.com">Email me</a>

    <!-- Legal row sits in the gradient shelves either side of the bottom tab -->
    <div class="lfooter__bottom">
      <span class="lfooter__copy">© 2026 Vishnujan Narayanan. All rights reserved</span>
      <div class="lfooter__legal">
        <a href="https://github.com/VishnujanNarayanan" target="_blank" rel="me noopener">GitHub</a>
        <a href="https://www.linkedin.com/in/vishnujan-narayanan" target="_blank" rel="me noopener">LinkedIn</a>
      </div>
    </div>
  </div>
</footer>
